# Supabase CLI configuration for ICONSULTA.
# Link to the remote project before pushing:  supabase link --project-ref llbxwmzruzwboceliftc
# Push schema:                                 supabase db push
# Deploy a function:                           supabase functions deploy <name>

project_id = "iconsulta"

[db]
# Postgres major version of the remote project (Supabase currently provisions 15).
major_version = 15

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public"]

# ---- Auth ---------------------------------------------------------------------
# Email confirmation is intentionally OFF: sign-up creates a usable account
# immediately and the app routes the new user to the Sign In screen to log in.
# NOTE: this block only governs the LOCAL stack (`supabase start`). The hosted
# project (llbxwmzruzwboceliftc) now has the matching toggle off as well:
#   Authentication -> Sign In / Providers -> Email -> "Confirm email" = off
#   (Management API field: mailer_autoconfirm = true)
# Leaving it ON there sends a confirmation mail per sign-up through Supabase's
# built-in mailer, which is capped at 2 messages/hour — every sign-up past the
# second failed with HTTP 429 "email rate limit exceeded". Turn confirmation
# back on only together with a real SMTP provider.
[auth]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# ---- Edge Functions -----------------------------------------------------------
# All functions require a valid Supabase JWT (verify_jwt = true, the default);
# each function additionally checks role/ownership internally.
[functions.book-appointment]
verify_jwt = true

[functions.respond-to-request]
verify_jwt = true

[functions.end-session]
verify_jwt = true

[functions.generate-summary]
verify_jwt = true

[functions.admin-manage-user]
verify_jwt = true

[functions.admin-metrics]
verify_jwt = true
